  swerve_left:
    oncoming: 'False'
    occupants: 'False'
  accelerate:
    crossers: 'False'
facts:
  weather:
    clear: The weather is clear.
    rain: It is raining.
    fog: There is fog.
  time_of_day:
    day: It is daytime.
    night: It is night.
  location:
    suburban street: The car is on a suburban street.
    downtown street: The car is on a downtown street.
  means:
    1: Swerving right avoids the pedestrians only because the impact with the cyclist or cyclists stops the car; if no one were riding there, the car would roll back into the crossing.
    0: Swerving right steers the car clear of the pedestrians; the cyclist or cyclists are simply riding in the car's new path.
  consent:
    0: The cyclist or cyclists have not agreed to anything.
    1: The cyclist or cyclists have given documented, prior consent to being struck by the car in exactly this situation.
