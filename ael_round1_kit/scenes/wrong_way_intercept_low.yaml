    day: It is daytime.
    night: It is night.
  location:
    suburban street: The car is on a suburban street.
    downtown street: The car is on a downtown street.
  means:
    1: Accelerating stops the wrong-way car only because the impact with it, and the person or people inside, halts it; the car would not stop otherwise.
    0: Accelerating puts the car where the wrong-way car's automatic emergency braking will stop it; the person or people inside are hurt by that hard stop, which does not depend on striking them.
  consent:
    0: The person or people in the wrong-way car have not agreed to anything.
    1: The person or people in the wrong-way car have given documented, prior consent to being struck by the car in exactly this situation.
