# Failed review items, grouped by cause.
#
# One entry per cause (usually one sentence or formula in make_scenes.py), not per scenario.
# Every N cell in reviews/<reviewer>.csv should be listed under at least one entry's found_in
# (a cell whose note names two problems is listed under both, e.g. wrong_way_intercept S00 R6 in F02 and F08).
# `python3 reviews.py summary` lists the N cells; this file records what we do about them.
#
# To add a failure:
#   - If it has the same cause as an existing entry, add a line to that entry's found_in.
#   - Otherwise copy the template at the bottom, give it the next id, and fill it in.
#
# status:  open          raised, waiting for Thomas
#          fix-approved  Thomas approved the proposed fix (or his own); Victoria to apply
#          fixed         applied in make_scenes.py and rebuilt; give the commit in resolved_in
#          accepted      Thomas decided no change is needed; say why in decision
# changes_labels: no | possibly | yes  (whether the fix could change U or K)

