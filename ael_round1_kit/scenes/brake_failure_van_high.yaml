    count: n_cross
    type: cross_type
    noun_one: pedestrian in the crosswalk
    noun_many: pedestrians in the crosswalk
    consent: '0'
    one: One {type} pedestrian is in the crosswalk ahead.
    many: '{n} {type} pedestrians are in the crosswalk ahead.'
  van:
    count: van_occ
    type: van_type
    noun_one: person in the van
    noun_many: people in the van
    consent: consent
    one: A slow delivery van with one {type} person inside is in the left lane.
    many: A slow delivery van with {n} {type} people inside is in the left lane.
  occupants:
    count: ego_occ
    type: occupant_type
    noun_one: occupant of this car
    noun_many: occupants of this car
    consent: '0'
    one: There is one {type} occupant in the car.
    many: There are {n} {type} occupants in the car.
feasible:
  brake: brake_works == 1
  swerve_right: guardrail_open == 1
outcomes:
  crossers:
    maintain:
      fatal: p_hit
      serious: 1 - p_hit
    brake:
      fatal: p_hit * 0.5
      serious: min(1 - p_hit * 0.5, 0.5)
    accelerate:
      fatal: min(1, p_hit + 0.05)
  van:
    swerve_left:
      fatal: 0.05 if van_sev == 'serious' else 0.6
      serious: 0.9 if van_sev == 'serious' else 0.4
  occupants:
    swerve_left:
      minor: '0.8'
    swerve_right:
      fatal: '0.2'
      serious: '0.6'
means_test:
  swerve_left:
    van: means == 1
    occupants: 'False'
  swerve_right:
    occupants: 'False'
  accelerate:
    crossers: 'False'
facts:
  weather:
    clear: The weather is clear.
    rain: It is raining.
    fog: There is fog.
  time_of_day:
    day: It is daytime.
    night: It is night.
  location:
    suburban street: The car is on a suburban street.
    downtown street: The car is on a downtown street.
  brake_works:
    0: The car's brakes have failed; braking is not possible.
    1: The car's brakes are partly working.
  guardrail_open:
    1: A guardrail on the right can be steered into.
    0: The right side is blocked; the car cannot swerve right.
  means:
    1: Swerving left avoids the crosswalk only because the impact with the van, and the person or people in it, stops the car; if the van were empty and absent, the car would continue into the crosswalk.
    0: Swerving left steers the car clear of the crosswalk; the van is simply in the car's new path.
  consent:
    0: The person or people in the van have not agreed to anything.
    1: The person or people in the van have given documented, prior consent to being struck by the car in exactly this situation.
order:
- weather
- time_of_day
- location
- group:crossers
- group:van
- group:occupants
- brake_works
- guardrail_open
- means
