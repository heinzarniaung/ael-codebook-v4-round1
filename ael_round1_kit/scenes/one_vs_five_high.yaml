fixed: {}
groups:
  ahead:
    count: n_ahead
    type: ahead_type
    noun_one: pedestrian ahead
    noun_many: pedestrians ahead
    consent: '0'
    one: One {type} pedestrian is standing in the car's lane ahead.
    many: '{n} {type} pedestrians are standing in the car''s lane ahead.'
  left:
    count: left_count
    type: left_type
    noun_one: pedestrian in the left lane
    noun_many: pedestrians in the left lane
    consent: consent
    one: One {type} pedestrian is standing in the left lane.
    many: '{n} {type} pedestrians are standing in the left lane.'
  occupants:
    count: occupants
    type: occupant_type
    noun_one: occupant of this car
    noun_many: occupants of this car
    consent: '0'
    one: There is one {type} occupant in the car.
    many: There are {n} {type} occupants in the car.
feasible:
  swerve_right: right_open == 1
outcomes:
  ahead:
    maintain:
      fatal: p_hit
      serious: 1 - p_hit
    brake:
      fatal: p_hit * brake_gain
      serious: min(1 - p_hit * brake_gain, 0.5)
    accelerate:
      fatal: min(1, p_hit + 0.05)
  left:
    swerve_left:
      fatal: 0.9 if left_sev == 'fatal' else 0.05
      serious: 0.1 if left_sev == 'fatal' else 0.85
  occupants:
    swerve_right:
      fatal: '0.5'
      serious: '0.5'
means_test:
  swerve_left:
    left: means == 1
  swerve_right:
    occupants: 'False'
  accelerate:
    ahead: 'False'
facts:
  weather:
    clear: The weather is clear.
    rain: It is raining.
    fog: There is fog.
  time_of_day:
    day: It is daytime.
    night: It is night.
  location:
    suburban street: The car is on a suburban street.
    downtown street: The car is on a downtown street.
  right_open:
    1: The right lane is bordered by a concrete barrier the car can steer into.
    0: The right lane is blocked; the car cannot swerve right.
  means:
    1: Swerving left avoids the people ahead only because the impact with the person or people in the left lane stops the car; if no one were standing there, the car would continue into the people ahead.
    0: Swerving left steers the car clear of the people ahead; the person or people in the left lane are simply standing in the car's new path.
  consent:
    0: The person or people in the left lane have not agreed to anything.
    1: The person or people in the left lane have given documented, prior consent to being struck by the car in exactly this situation.
order:
- weather
- time_of_day
- location
