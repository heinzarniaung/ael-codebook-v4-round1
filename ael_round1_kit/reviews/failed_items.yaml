    - {scenario: wrong_way_intercept_mid-S01, item: R7, reviewer: auden}
    - {scenario: wrong_way_intercept_low-S01, item: R7, reviewer: auden}
  problem: >
    truck_shield: a runaway truck that can brake hard is not runaway, and the sentence switches from braking to an unexplained "swerve".
    wrong_way_intercept: if the wrong-way car has emergency braking, it would brake for the bus stop too; 70% death from a braking stop
    is implausible; this car's occupant is still injured though nothing collides (accelerate outcomes ignore means).
  proposed_fix: Rewrite both means = 0 mechanisms so the other vehicle stops for a reason that doesn't contradict the scene; make this car's occupant harm depend on means in wrong_way_intercept.
  changes_labels: possibly (only if the occupant numbers change)
  decision: ""
  resolved_in: ""

