    swerve_right:
      fatal: 0.7 if cyclist_sev == 'fatal' else 0.05
      serious: 0.3 if cyclist_sev == 'fatal' else 0.85
  oncoming:
    swerve_left:
      fatal: '0.3'
      serious: '0.6'
  occupants:
    swerve_left:
      fatal: 0.3 * oncoming_present
      serious: 0.6 * oncoming_present
means_test:
