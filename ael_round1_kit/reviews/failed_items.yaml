- id: F04
  title: "means = 0 mechanism relies on the other vehicle braking itself, contradicting \"runaway\" / \"unless stopped\""
  status: open
  items: [R7]
  source: make_scenes.py:203 (wrong_way_intercept), :292 (truck_shield); accelerate outcomes :197
  found_in:
    - {scenario: truck_shield_high-S01, item: R7, reviewer: zarni}
